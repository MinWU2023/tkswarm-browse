name: Release 第一页自研浏览器

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install & build Windows (NSIS + portable)
        run: |
          npm ci
          npm run dist:win
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          Write-Host "=== dist/ ==="
          Get-ChildItem dist -File | Format-Table Name, Length
          $setup = Get-ChildItem dist -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem dist -Filter "*-portable.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "NSIS setup EXE missing" }
          if (-not $portable) { throw "Portable EXE missing — check package.json win.target includes portable" }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-Windows
          path: |
            dist/*-setup.exe
            dist/*-portable.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install & build macOS (DMG + ZIP, x64 + arm64)
        run: |
          npm ci
          npm run dist:mac
      - name: Verify macOS artifacts
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          test -n "$(ls dist/*.dmg 2>/dev/null)" || (echo "DMG missing" && exit 1)
          test -n "$(ls dist/*.zip 2>/dev/null)" || (echo "ZIP missing" && exit 1)
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/TkSwarmBrowser-Windows/* artifacts/TkSwarmBrowser-macOS/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found" >&2
            ls -laR artifacts || true
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s):"
          printf ' - %s\n' "${files[@]}"

          NOTES="## 下载说明

          ### Windows
          - **TkSwarmBrowser-*-win-portable.exe** — 绿色免安装便携版（推荐），数据在 exe 同级 data/
          - **TkSwarmBrowser-*-win-x64-setup.exe** — NSIS 安装版

          ### macOS
          - **TkSwarmBrowser-*-mac-arm64.dmg** — Apple Silicon (M 系列)
          - **TkSwarmBrowser-*-mac-x64.dmg** — Intel Mac
          - 对应 \`.zip\` 为解压即用

          本地 API 默认 http://127.0.0.1:54345，与 tkswarm-node 比特接口兼容。"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "第一页自研浏览器 ${GITHUB_REF_NAME}" \
              --notes "$NOTES" \
              "${files[@]}"
          fi
