name: Release TkSwarm Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder 在 tag 下会尝试 publish；发版由本 workflow 的 release job 负责
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install & build
        run: |
          npm ci
          npx electron-builder --win --publish never
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-Windows
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install & build
        run: |
          npm ci
          npx electron-builder --mac --publish never
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # gh release create 需要仓库上下文（或 --repo）；仅 download-artifact 时没有 .git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/TkSwarmBrowser-Windows/* artifacts/TkSwarmBrowser-macOS/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found" >&2
            ls -laR artifacts || true
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s):"
          printf ' - %s\n' "${files[@]}"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "TkSwarm Browser ${GITHUB_REF_NAME}" \
              --notes "Windows EXE + macOS DMG/ZIP. 本地 API 默认 http://127.0.0.1:54345，与 tkswarm-node 比特接口兼容。" \
              "${files[@]}"
          fi
